<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DNRB 에이전트</title>
  <meta name="description" content="다나로브 쇼핑몰 매출 성장을 돕는 AI 담당자들의 보고서" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='800'%3EAI%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <!-- 자산 버전(?v=): 배포할 때 바꿔 휴대폰·PC 브라우저가 옛 JS·CSS를 쓰지 않게 한다 (2026-09-18) -->
  <link rel="stylesheet" href="css/app.css?v=20260918a" />
</head>
<body>

  <!-- 로그인 (워크스페이스와 같은 계정) -->
  <div id="login" class="login" style="display:none;">
    <form class="login-box" onsubmit="submitLogin(event)">
      <div class="logo"><span class="mark">AI</span><div><b>DNRB 에이전트</b><span class="muted">워크스페이스와 같은 계정으로 로그인</span></div></div>
      <label>아이디<input id="login-id" type="text" autocomplete="username" required /></label>
      <label>비밀번호<input id="login-pw" type="password" autocomplete="current-password" required /></label>
      <button class="btn primary wide" id="login-btn" type="submit">로그인</button>
      <div id="login-msg" class="err-text"></div>
      <a class="muted small" href="https://danarobe.github.io/dnrb-dashboard/">← DNRB 워크스페이스로</a>
    </form>
  </div>

  <!-- 본문 -->
  <div id="app" style="display:none;">
    <header class="top">
      <a class="logo" href="#home"><span class="mark">AI</span><b>DNRB 에이전트</b></a>
      <nav class="nav" id="nav"></nav>
      <div class="top-right">
        <span id="notif-wrap" class="notif-wrap"><button class="btn ghost sm" onclick="notifToggle(event)" title="알림" aria-label="알림"><i class="fa-regular fa-bell"></i><span id="notif-badge" class="notif-badge" style="display:none;"></span></button></span>
        <a class="btn ghost sm" href="https://danarobe.github.io/dnrb-dashboard/" title="DNRB 워크스페이스로 이동"><i class="fa-solid fa-table-columns"></i> <span class="hide-m">워크스페이스</span></a>
        <span id="user-info" class="muted"></span>
        <button class="btn ghost sm" onclick="logout()" title="로그아웃"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </header>
    <main id="main" class="main"></main>
    <footer class="foot muted">에이전트는 제안만 합니다. 광고·가격·고객 발송 같은 실제 실행은 사람이 확인한 뒤에 합니다.</footer>
  </div>

  <div id="notif-drop" class="notif-drop" style="display:none;"></div>
  <div id="toast" class="toast"></div>

  <script src="js/config.js?v=20260918a"></script>
  <script src="js/api.js?v=20260918a"></script>
  <script src="js/agents.js?v=20260918a"></script>
  <script src="js/reports.js?v=20260918a"></script>
  <script src="js/notify.js?v=20260918a"></script>
  <script src="js/ask.js?v=20260918a"></script>
  <script src="js/app.js?v=20260918a"></script>
</body>
</html>
